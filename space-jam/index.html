<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>🐰🏀 Space Jam Logo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Luckiest+Guy">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Paytone+One">
  <link rel="stylesheet" href="../vendor/normalize.css">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <h1 class="space-jam">
    <span class="j-j" data-text="J" aria-hidden="true">J</span>
    <div class="rings">
      <div class="ring-1"></div>
      <div class="ring-2"></div>
      <div class="ring-3"></div>
      <div class="ring-4"></div>
    </div>
    <span class="s-s" data-text="S">S</span>
    <span class="s-p" data-text="p">p</span>
    <span class="s-a" data-text="a">a</span>
    <span class="s-c" data-text="c">c</span>
    <span class="s-e" data-text="e">e</span>
    <span class="j-j" data-text="J">J</span>
    <span class="j-a" data-text="a">a</span>
    <span class="j-m" data-text="m">m</span>
    <span class="j-j" data-text="J" aria-hidden="true">J</span>
  </h1>

  <iframe
    id="video"
    title="Space Jam theme song"
    width="560"
    height="315"
    src="https://www.youtube.com/embed/fZOK-Tl5wyg?rel=0&start=16"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <script src="./index.js"></script>
</body>
</html>
